<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giám sát lợn sổng chuồng</title>
<style>
:root{
  --bg:#f4f6f3;
  --panel:#fff;
  --sub:#f8faf7;
   --ink:#111c16;
   --muted:#5c6c63;
   --line:#e2e8e0;
   --line2:#cdd7ca;
   --brand:#1b7a43; 
   --brand-soft:#eaf5ee;
   --brand-bd:#b8dfc6;
   --cb:#d97706;
   --cb-soft:#fffbeb;
   --cb-bd:#fde68a;
   --kc:#dc2626;
   --kc-soft:#fef2f2;
   --kc-bd:#fecaca;
   --kc-ink:#991b1b;
   --shadow:0 1px 2px rgba(17,28,22,.06),0 4px 14px rgba(17,28,22,.05);
   color-scheme:light
  }
[data-theme=dark]{
  --bg:#0e1511;
  --panel:#16201a;
  --sub:#1b2720;
  --ink:#e8efe9;
  --muted:#93a69a;
  --line:#25332a;
  --line2:#33463a;
  --brand:#34c370;
  --brand-soft:#15291d;
  --brand-bd:#235a38;
  --cb:#f59e0b;
  --cb-soft:#2a2210;
  --cb-bd:#5a4514;
  --kc:#f87171;
  --kc-soft:#2b1415;
  --kc-bd:#6b2224;
  --kc-ink:#fecaca;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(1100px 480px at 85% -10%,rgba(27,122,67,.12),
  transparent 60%),var(--bg);
  color:var(--ink);
  font:14px/1.45 Inter,system-ui,
  -apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 20px;
  background:color-mix(in srgb,var(--panel) 85%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:5
}
.logo{
  width:32px;
  height:32px;
  border-radius:9px;
  background:linear-gradient(135deg,#1b7a43,#146134);
  display:grid;
  place-items:center;
  color:#fff;
  font-size:17px
}
header h1{
  font-size:15px;
  margin:0;
  font-weight:650;
  letter-spacing:-.01em}
.sp{
  flex:1
}
.live{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--muted)
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--brand);
  display:inline-block
}
.dot.bad{
  background:var(--kc);
  animation:pl 1s infinite
}
@keyframes pl{50%{opacity:.3}}
main{
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
  gap:16px;
  max-width:1280px;
  margin:0 auto;
  padding:16px 20px
}
@media(max-width:900px){main{
  grid-template-columns:1fr;
  padding:12px}}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
  margin-bottom:14px
}
.card>h2{
  font-size:12px;
  font-weight:650;
  color:var(--muted);
  margin:0;
  padding:12px 14px 0;
  letter-spacing:.02em;
  display:flex;
  align-items:center;
  gap:8px
}
.card>h2 i{
  font-style:normal;
  display:grid;
  place-items:center;
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--brand-soft);
  color:var(--brand);
  font-size:11px
}
.pad{
  padding:12px 14px 14px
}
.bar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  padding:10px 12px;
  border-bottom:1px solid var(--line)
}
.ttl{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:650;
  font-size:13px;
  flex:1}
button,input,textarea{
  font:inherit;
  color:inherit
}
button{
  border:1px solid var(--line2);
  background:var(--panel);
  border-radius:9px;
  padding:7px 12px;
  cursor:pointer;
  transition:.15s
}
button:hover{
  border-color:var(--brand);
  color:var(--brand)
}
button.ic{
  width:34px;
  height:34px;
  padding:0;
  display:grid;
  place-items:center}
:focus-visible{
  outline:2px solid var(--brand);
  outline-offset:1px
}
.stage{
  position:relative;
  background:#1e2420;
  border-radius:0 0 14px 14px;
  overflow:hidden;
  min-height:220px
}
canvas{
  display:block;
  width:100%;
  touch-action:none;
  cursor:crosshair
}
.drop{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:#c6d6cb;
  cursor:pointer;
  text-align:center;
  background:radial-gradient(circle at 50% 40%,#2e3d33,#171e1a)
}
.drop[hidden]{
  display:none
}
.drop b{
  font-size:16px;
  color:#fff}
.drop span{
  font-size:12px;
  opacity:.7;
  padding:0 16px
}
.vrow{
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px 12px;
  border-top:1px solid var(--line)
}
.vrow[hidden]{
  display:none
}
.vrow input{
  flex:1;
  accent-color:var(--brand)
}
.banner{
  display:none;
  align-items:center;
  gap:10px;
  margin:12px;
  padding:11px 14px;
  border-radius:11px;
  background:var(--kc-soft);
  border:1px solid var(--kc-bd);
  color:var(--kc-ink);
  font-weight:600;
  animation:in .25s ease
}
.banner.show{
  display:flex
}
@keyframes in{from{opacity:0;transform:translateY(-4px)}}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}
.stat{
  border-radius:11px;
  padding:10px 12px;
  border:1px solid var(--line);
  transition:transform .15s
}
.stat:hover{
  transform:translateY(-2px)
}
.stat b{
  display:block;
  font-size:22px;
  line-height:1.1;
  font-variant-numeric:tabular-nums
}
.stat span{
  font-size:12px;
  color:var(--muted)
}
.stat.t{
  background:var(--brand-soft);
  border-color:var(--brand-bd)
}
  .stat.t b{
    color:var(--brand)
  }
.stat.c{
  background:var(--cb-soft);
  border-color:var(--cb-bd)
}
  .stat.c b{color:var(--cb)}
.stat.n{
  background:var(--kc-soft);
  border-color:var(--kc-bd)
}
.stat.n b{
  color:var(--kc)
}
.kv{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:13px
}
.kv b{
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  font-weight:600
}
.ds{
  margin:0 0 8px;
  padding:0;
  list-style:none;
  font-size:13px
}
.ds:empty{
  display:none
}
.ds li{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:6px 0;
  border-bottom:1px solid var(--line)
}
.ds li b{
  color:var(--kc)
}
.ds li span{
  color:var(--muted);
  font-variant-numeric:tabular-nums
}
.fld{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
  color:var(--muted)
}
input[type=number],input[type=text]{
  width:84px;
  border:1px solid var(--line2);
  background:var(--sub);
  border-radius:8px;
  padding:6px 9px;
  text-align:right
}
textarea{
  width:100%;
  border:1px solid var(--line2);
  background:var(--sub);
  border-radius:10px;
  padding:8px 10px;
  font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;
  resize:vertical
}
.btns{
  display:flex;
  gap:8px;
  margin-top:8px;
  flex-wrap:wrap
}
.btns>*{
  flex:1
}
.filebtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  padding:11px;
  border:1.5px dashed var(--line2);
  border-radius:10px;
  background:var(--sub);
  color:var(--muted);
  cursor:pointer;
  font-size:13px;
  transition:.15s;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis
}
.filebtn:hover{
  border-color:var(--brand);
  color:var(--brand);
  background:var(--brand-soft)
  }
</style>
</head>
<body>
<header>
  <div class="logo">🐖</div>
  <h1>Giám sát lợn sổng chuồng</h1>
  <div class="sp"></div>
  <div class="live"><i class="dot" id="dot"></i><span id="lv">Bình thường</span></div>
  <button class="ic" id="theme" aria-label="Đổi giao diện sáng tối" title="Sáng / tối"></button>
</header>

<main>
  <section>
    <div class="card">
      <div class="bar">
        <div class="ttl"><i class="dot"></i>Khung chuồng </div>
        <button type="button" id="b-xoachuong">Xoá khung</button>
      </div>
      <div class="stage"><canvas id="cv"></canvas>
        <label class="drop" id="drop" for="file">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>
        </label>
      </div>
      <div class="vrow" id="vrow" hidden>
        <button type="button" id="b-play">Phát</button>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Tua video">
      </div>
      <div class="banner" id="bn"></div>
    </div>
  </section>

  <aside>
    <div class="card">
      <h2>TRẠNG THÁI</h2>
      <div class="pad"><div class="stats">
        <div class="stat t"><b id="s-t">0</b><span>Trong chuồng</span></div>
        <div class="stat c"><b id="s-c">0</b><span>Chạm vạch</span></div>
        <div class="stat n"><b id="s-n">0</b><span>Ra hẳn</span></div>
      </div>
      <div style="margin-top:10px">
        <div class="kv"><span>Chuồng (mã ô)</span><b id="s-ma">A</b></div>
        <div class="kv"><span>Tổng số con</span><b id="s-tong">0</b></div>
        <div class="kv"><span>Cập nhật lúc</span><b id="s-up">--:--:--</b></div>
        <div class="kv"><span>Cảnh báo gần nhất</span><b id="s-cb">Chưa có</b></div>
      </div></div>
    </div>

    <div class="card">
      <h2><i>1</i>NGUỒN HÌNH</h2>
      <div class="pad"><label class="filebtn" for="file" id="fn">Chọn ảnh / video</label><input type="file" id="file" accept="image/*,video/*" hidden></div>
    </div>

    <div class="card">
      <h2>CẤU HÌNH</h2>
      <div class="pad">
        <label class="fld" style="margin:0">Mã ô <input type="text" id="ma" value="A"></label>
      </div>
    </div>

    <div class="card">
      <h2>SỰ KIỆN</h2>
      <div class="pad">
        <ul class="ds" id="ds"></ul>
        <textarea id="ej" rows="6" readonly placeholder="Chưa có sự kiện" aria-label="Sự kiện"></textarea>
        <div class="btns"><button type="button" data-c="ej">Sao chép sự kiện</button><button type="button" id="b-xoacb">Xoá cảnh báo</button></div>
      </div>
    </div>
  </aside>
</main>

<script>
const API=location.pathname==="/app"?location.origin:"http://127.0.0.1:8000";
const $=id=>document.getElementById(id);
const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function datTheme(t){document.documentElement.dataset.theme=t;$("theme").innerHTML=t==="dark"?SUN:MOON;try{localStorage.setItem("theme",t)}catch{}}
let t0=null;try{t0=localStorage.getItem("theme")}catch{}
datTheme(t0||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("theme").onclick=()=>datTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

const cv=$("cv"),ctx=cv.getContext("2d");
const vid=document.createElement("video");vid.muted=true;vid.playsInline=true;vid.loop=true;
let W=640,H=360,dpr=1,img=null,isVideo=false;
let pen=null,pigs=[],drag=null,hover=null,evName="",offline=false,errMsg="",got=-1;
let srcId=0,needReset=true,lastKey=null;
const XAC_NHAN_MS=500;       
const lac=new Map();         
const dem=new Map();        
const logSK=[];
let capNhatLuc=null;
const hms=d=>d.toLocaleTimeString("vi-VN",{hour12:false});
function veDS(){
  $("ds").innerHTML=logSK.map(e=>{const t=e.thoi_gian.split("T");return'<li><b>#'+e.du_lieu.id_theo_doi+' sổng chuồng</b><span>'+t[1]+' · '+t[0].split("-").reverse().join("/")+'</span></li>'}).join("");
}
function xoaCanhBao(){lac.clear();dem.clear();logSK.length=0;$("ej").value="";veDS()}
const natW=()=>isVideo?vid.videoWidth:img?img.naturalWidth:640;
const natH=()=>isVideo?vid.videoHeight:img?img.naturalHeight:360;
function setSize(){
  W=cv.parentElement.clientWidth||640;H=Math.round(W*natH()/natW());dpr=window.devicePixelRatio||1;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.height=H+"px";
}
function nguonMoi(){srcId++;needReset=true;lastKey=null;pigs=[];xoaCanhBao()}
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const u=URL.createObjectURL(f);nguonMoi();$("drop").hidden=true;$("fn").textContent=f.name;
  if(f.type.startsWith("video")){
    isVideo=true;img=null;vid.src=u;
    vid.onloadedmetadata=()=>{setSize();$("vrow").hidden=false;vid.currentTime=0};
  }else{
    isVideo=false;$("vrow").hidden=true;vid.pause();$("b-play").textContent="Phát";
    const i=new Image();i.onload=()=>{img=i;setSize()};i.src=u;
  }
};
$("b-play").onclick=()=>{if(vid.paused){vid.play();$("b-play").textContent="Dừng"}else{vid.pause();$("b-play").textContent="Phát"}};
$("seek").oninput=e=>{if(vid.duration){vid.currentTime=vid.duration*e.target.value/1000;needReset=true;xoaCanhBao()}};
addEventListener("resize",setSize);

const goc=b=>[[b.x1,b.y1],[b.x2,b.y1],[b.x2,b.y2],[b.x1,b.y2]];
const px=p=>[p[0]*W,p[1]*H];
const dpx=(a,b)=>Math.hypot((a[0]-b[0])*W,(a[1]-b[1])*H);
function inPoly(p){ 
  const v=pen.pts;let c=false;
  for(let i=0,j=v.length-1;i<v.length;j=i++){
    const[xi,yi]=v[i],[xj,yj]=v[j];
    if((yi>p[1])!==(yj>p[1])&&p[0]<(xj-xi)*(p[1]-yi)/(yj-yi)+xi)c=!c;
  }
  return c;
}
const inRect=(p,b)=>p[0]>=b.x1&&p[0]<=b.x2&&p[1]>=b.y1&&p[1]<=b.y2;
function segX(a,b,c,d){
  const o=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
  return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0;
}
const TAM_X=0.5,TAM_Y=0.5;
const tamBox=p=>[p.x1+(p.x2-p.x1)*TAM_X,p.y1+(p.y2-p.y1)*TAM_Y];
function trangThai(p){
  if(!pen||!pen.closed)return"trong";
  const tam=tamBox(p);
  if(!inPoly(tam))return"ngoai";
  const cs=goc(p),v=pen.pts;
  let cross=false;
  for(let i=0;i<4&&!cross;i++)for(let j=0;j<v.length;j++){
    if(segX(cs[i],cs[(i+1)%4],v[j],v[(j+1)%v.length])){cross=true;break}
  }
  if(cross||cs.some(q=>!inPoly(q))||v.some(q=>inRect(q,p)))return"cham";
  return"trong";
}
function xuLy(){ 
  if(drag)return; 
  const now=performance.now(),co=new Set();
  pigs.forEach((g,i)=>{
    const k=g.id??(i+1);co.add(k);
    if(lac.has(k))return;
    if(trangThai(g)==="ngoai"){if(!dem.has(k))dem.set(k,now)}else dem.delete(k);
    if(dem.has(k)&&now-dem.get(k)>=XAC_NHAN_MS){
      const ev={loai:"lac_chuong",o:$("ma").value||"A",thoi_gian:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,19),muc:"khan_cap",du_lieu:{id_theo_doi:k,hop:[g.x1,g.y1,g.x2,g.y2].map(v=>+v.toFixed(4))}};
      lac.set(k,{ev,box:{x1:g.x1,y1:g.y1,x2:g.x2,y2:g.y2}});
      logSK.push(ev);veDS();
      $("ej").value=logSK.map(e=>JSON.stringify(e,null,2)).join("\n");
      guiSuKien(ev);
    }
  });
  dem.forEach((_,k)=>{if(!co.has(k))dem.delete(k)});
}
function distSeg(p,a,b){ 
  const[px_,py_]=[p[0]*W,p[1]*H],[ax,ay]=[a[0]*W,a[1]*H],[bx,by]=[b[0]*W,b[1]*H];
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;
  const t=Math.max(0,Math.min(1,((px_-ax)*dx+(py_-ay)*dy)/l2));
  return{d:Math.hypot(px_-(ax+t*dx),py_-(ay+t*dy)),pt:[(ax+t*dx)/W,(ay+t*dy)/H]};
}
const dinhGan=p=>{if(!pen)return-1;for(let i=0;i<pen.pts.length;i++)if(dpx(p,pen.pts[i])<=14)return i;return-1};

const pt=e=>{const r=cv.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
function dongKhung(){
  if(pen&&!pen.closed&&pen.pts.length>=3)pen.closed=true;
}
cv.onpointerdown=e=>{
  const p=pt(e);cv.setPointerCapture(e.pointerId);
  if(!pen||!pen.closed){
    if(!pen)pen={pts:[],closed:false};
    const v=pen.pts;
    if(v.length>=3&&dpx(p,v[0])<=14){pen.closed=true;return}
    if(!v.length||dpx(p,v[v.length-1])>6)v.push(p);
    return;
  }
  const i=dinhGan(p);
  if(i>=0)drag={t:"v",i};
  else if(inPoly(p))drag={t:"mv",p0:p,pts:pen.pts.map(q=>[...q])};
};
cv.onpointermove=e=>{
  const p=pt(e);hover=p;
  if(!drag)return;
  if(drag.t==="v")pen.pts[drag.i]=p;
  else if(drag.t==="mv"){
    const xs=drag.pts.map(q=>q[0]),ys=drag.pts.map(q=>q[1]);
    const dx=Math.max(-Math.min(...xs),Math.min(1-Math.max(...xs),p[0]-drag.p0[0]));
    const dy=Math.max(-Math.min(...ys),Math.min(1-Math.max(...ys),p[1]-drag.p0[1]));
    pen.pts=drag.pts.map(q=>[q[0]+dx,q[1]+dy]);
  }
};
cv.onpointerup=cv.onpointercancel=()=>{drag=null};
cv.onpointerleave=()=>{hover=null};
cv.ondblclick=e=>{
  const p=pt(e);
  if(!pen)return;
  if(!pen.closed){dongKhung();return}
  const i=dinhGan(p);
  if(i>=0){if(pen.pts.length>3)pen.pts.splice(i,1);return}
  const v=pen.pts;let best=null;
  for(let k=0;k<v.length;k++){
    const r=distSeg(p,v[k],v[(k+1)%v.length]);
    if(r.d<=10&&(!best||r.d<best.d))best={d:r.d,k,pt:r.pt};
  }
  if(best)v.splice(best.k+1,0,best.pt);
};
$("b-xoachuong").onclick=()=>{pen=null;drag=null};
$("b-xoacb").onclick=xoaCanhBao;

const grab=document.createElement("canvas");
async function detect(){
  const nw=natW(),nh=natH(),s=Math.min(1,1280/nw);
  grab.width=Math.round(nw*s);grab.height=Math.round(nh*s);
  grab.getContext("2d").drawImage(isVideo?vid:img,0,0,grab.width,grab.height);
  const blob=await new Promise(r=>grab.toBlob(r,"image/jpeg",.85));
  const fd=new FormData();fd.append("file",blob,"frame.jpg");
  const r=await fetch(API+"/detect",{method:"POST",body:fd});
  if(!r.ok){let m="HTTP "+r.status;try{m+=": "+(await r.json()).detail}catch{}throw new Error(m)}
  return r.json();
}
async function loop(){
  for(;;){
    const san=img||(isVideo&&vid.readyState>=2);
    const key=isVideo?vid.currentTime:"img";
    if(san&&key!==lastKey){
      const id=srcId;
      try{
        if(needReset){needReset=false;try{await fetch(API+"/reset",{method:"POST"})}catch{}}
        const d=await detect();
        if(id===srcId){
          lastKey=key;offline=false;
          pigs=d.boxes.map((b,i)=>({x1:b.norm[0],y1:b.norm[1],x2:b.norm[2],y2:b.norm[3],id:b.track_id??(i+1)}));
          got=pigs.length;capNhatLuc=new Date();
        }
      }catch(e){
        offline=true;errMsg=e.message==="Failed to fetch"?"không gọi được "+API:e.message;
        console.error("Backend:",e);await new Promise(r=>setTimeout(r,1500));
      }
    }
    await new Promise(r=>setTimeout(r,120));
  }
}
loop();

function guiSuKien(ev){
  fetch(API+"/events",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(ev)})
    .catch(e=>console.error("Không gửi được sự kiện:",e));
}

const MAU={trong:"#10b981",cham:"#f59e0b",ngoai:"#ef4444"},TEN={trong:"Trong",cham:"Chạm vạch",ngoai:"Ra hẳn"};
function nhan(x,y,t,c){
  ctx.font="600 11px Inter,system-ui,sans-serif";const w=ctx.measureText(t).width+12;
  ctx.fillStyle=c;ctx.beginPath();(ctx.roundRect?ctx.roundRect(x,Math.max(0,y-19),w,19,5):ctx.rect(x,Math.max(0,y-19),w,19));ctx.fill();
  ctx.fillStyle="#fff";ctx.fillText(t,x+6,Math.max(14,y-6));
}
function veChuong(){
  const v=pen.pts.map(px);
  if(!v.length)return;
  ctx.beginPath();ctx.moveTo(v[0][0],v[0][1]);
  for(let i=1;i<v.length;i++)ctx.lineTo(v[i][0],v[i][1]);
  if(pen.closed){
    ctx.closePath();ctx.fillStyle="rgba(16,185,129,.14)";ctx.fill();
  }else if(hover){
    ctx.lineTo(hover[0]*W,hover[1]*H);
  }
  ctx.strokeStyle=MAU.trong;ctx.lineWidth=2.5;ctx.setLineDash([8,5]);ctx.stroke();ctx.setLineDash([]);
  v.forEach(([x,y],i)=>{
    ctx.beginPath();ctx.arc(x,y,i===0&&!pen.closed?7:5,0,7);
    ctx.fillStyle=MAU.trong;ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.stroke();
  });
  const top=v.reduce((m,q)=>q[1]<m[1]?q:m,v[0]);
  nhan(top[0],top[1],pen.closed?"Chuồng":"Đang vẽ… ("+v.length+" đỉnh)",MAU.trong);
}
function khung(){
  xuLy();
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  if(isVideo&&vid.readyState>=2)ctx.drawImage(vid,0,0,W,H);
  else if(img)ctx.drawImage(img,0,0,W,H);
  else{ctx.fillStyle="#26312a";ctx.fillRect(0,0,W,H);ctx.fillStyle="#9fb3a6";ctx.font="14px Inter,system-ui,sans-serif";ctx.textAlign="center";ctx.fillText("Chọn ảnh hoặc video chuồng ở mục Nguồn hình",W/2,H/2);ctx.textAlign="start"}
  if(pen)veChuong();
  {const tx=offline?"Lỗi backend: "+errMsg:got<0?"chưa nhận kết quả từ backend":"backend trả về "+got+" box";
   ctx.font="600 12px Inter,system-ui,sans-serif";const w=ctx.measureText(tx).width+16;
   ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(8,8,w,22);ctx.fillStyle=offline?"#f87171":"#fff";ctx.fillText(tx,16,23)}
  const n={trong:0,cham:0,ngoai:lac.size},hien=new Set();
  pigs.forEach((g,i)=>{
    const k=g.id??(i+1);hien.add(k);
    const st=lac.has(k)?"ngoai":trangThai(g);
    if(st!=="ngoai")n[st]++;
    const[a,b]=px([g.x1,g.y1]),[c,d]=px([g.x2,g.y2]);
    if(st==="ngoai"){ctx.fillStyle="rgba(239,68,68,.18)";ctx.fillRect(a,b,c-a,d-b)}
    ctx.strokeStyle=MAU[st];ctx.lineWidth=st==="ngoai"?4:2.5;ctx.strokeRect(a,b,c-a,d-b);
    nhan(a,b,"#"+k+" "+TEN[st],MAU[st]);
    {const[tx,ty]=px(tamBox(g));ctx.beginPath();ctx.arc(tx,ty,4,0,7);ctx.fillStyle=MAU[st];ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.stroke();}
  });
  lac.forEach((v,k)=>{ 
    if(hien.has(k))return;
    const[a,b]=px([v.box.x1,v.box.y1]),[c,d]=px([v.box.x2,v.box.y2]);
    ctx.fillStyle="rgba(239,68,68,.18)";ctx.fillRect(a,b,c-a,d-b);
    ctx.strokeStyle=MAU.ngoai;ctx.lineWidth=4;ctx.setLineDash([6,4]);ctx.strokeRect(a,b,c-a,d-b);ctx.setLineDash([]);
    nhan(a,b,"#"+k+" "+TEN.ngoai,MAU.ngoai);
  });
  $("s-t").textContent=n.trong;$("s-c").textContent=n.cham;$("s-n").textContent=n.ngoai;
  $("s-ma").textContent=$("ma").value||"A";
  $("s-tong").textContent=n.trong+n.cham+n.ngoai;
  $("s-up").textContent=capNhatLuc?hms(capNhatLuc):"--:--:--";
  $("s-cb").textContent=logSK.length?logSK[logSK.length-1].thoi_gian.split("T")[1]:"Chưa có";
  const bn=$("bn");
  if(lac.size){
    bn.className="banner show";bn.textContent="Phát hiện lợn sổng chuồng: "+[...lac.keys()].map(k=>"#"+k).join(", ");
    $("dot").className="dot bad";$("lv").textContent="Cảnh báo";
  }else{
    bn.className="banner";
    if(offline){$("dot").className="dot bad";$("lv").textContent="Lỗi backend: "+errMsg}
    else{$("dot").className="dot";$("lv").textContent="Bình thường"+(got>=0?" · backend thấy "+got+" con":"")}
  }
  if(isVideo&&vid.duration&&!vid.paused)$("seek").value=vid.currentTime/vid.duration*1000;
  requestAnimationFrame(khung);
}
setSize();requestAnimationFrame(khung);

document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
  const el=$(b.dataset.c);el.select();
  (navigator.clipboard?navigator.clipboard.writeText(el.value):Promise.reject()).catch(()=>document.execCommand("copy"));
  const t=b.textContent;b.textContent="Đã chép";setTimeout(()=>b.textContent=t,1200);
});
</script>
