<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Trang trại{% endblock %} – Giám sát lợn</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body {% block body_attr %}{% endblock %}>
<div class="phone">
  <header class="topbar">
    <div class="topbar-title-wrap">
      {% block back %}{% endblock %}
      <div>
        <h1>{% block heading %}Trang trại{% endblock %}</h1>
        <div class="topbar-sub"><span class="live-dot" aria-hidden="true"></span>AI Camera Giám sát 24/7</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button type="button" id="btn-theme" class="icon-btn" title="Đổi chế độ Sáng / Tối" aria-label="Đổi chế độ Sáng hoặc Tối">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </button>
    </div>
  </header>
  <div id="banner" class="banner" role="alert" aria-live="polite" hidden></div>
  <main class="screen {% block screen_class %}{% endblock %}">{% block content %}{% endblock %}</main>
  <nav class="tabbar" aria-label="Điều hướng chính">
    <a href="/" class="{{ 'on' if tab=='home' }}">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></i>
      Trang chủ
    </a>
    <a href="/o-chuong" class="{{ 'on' if tab=='o' }}">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></i>
      Ô chuồng
    </a>
    <a href="/dan" class="{{ 'on' if tab=='dan' }}">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></i>
      Đàn
    </a>
    <a href="/su-kien" class="{{ 'on' if tab=='sk' }}">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></i>
      Sự kiện
    </a>
    <a href="/cai-dat" class="{{ 'on' if tab=='cd' }}">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></i>
      Cài đặt
    </a>
  </nav>
</div>
<div id="lightbox" class="lightbox" hidden aria-label="Xem ảnh phóng to">
  <img id="lightbox-img" src="" alt="Ảnh phóng to">
</div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
